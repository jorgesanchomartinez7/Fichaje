name: Autofichaje netTime

on:
  schedule:
    - cron: "55 5 * * 1-5"
    - cron: "55 14 * * 1-4"
    - cron: "55 11 * * 5"
  workflow_dispatch: {}

jobs:
  fichar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Determinar evento (entrada/salida) según la hora del disparo
        id: evento
        run: |
          hora_utc=$(date -u +%H)
          if [ "$hora_utc" == "05" ]; then
            echo "evento=entrada" >> "$GITHUB_OUTPUT"
          else
            echo "evento=salida" >> "$GITHUB_OUTPUT"
          fi

      - name: Fichar
        env:
          NETTIME_URL: ${{ secrets.NETTIME_URL }}
          NETTIME_USER: ${{ secrets.NETTIME_USER }}
          NETTIME_PASS: ${{ secrets.NETTIME_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          VACACIONES_SHEET_CSV_URL: ${{ secrets.VACACIONES_SHEET_CSV_URL }}
        run: python fichar.py ${{ steps.evento.outputs.evento }} ${{ github.event_name == 'workflow_dispatch' && 'now' || '' }}

      - name: Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-debug
          path: debug_*.png
          if-no-files-found: ignore
