name: Autofichaje netTime

on:
  schedule:
    # Cada 10 min, de 5:00 a 16:59 UTC, L-V. Cubre entrada (8:00 Madrid) y
    # salida (17:00/14:00 Madrid) tanto en horario de invierno como de verano.
    - cron: "3-59/10 5-16 * * 1-5"
  workflow_dispatch:
    inputs:
      evento:
        description: "Evento a probar manualmente"
        required: false
        default: "salida"
        type: choice
        options:
          - entrada
          - salida

jobs:
  fichar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decidir si toca fichar ahora
        id: decidir
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            evento="${{ inputs.evento }}"
          else
            evento=$(python decidir.py)
          fi
          echo "evento=$evento" >> "$GITHUB_OUTPUT"
          echo "fecha=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"

      - name: Comprobar si ya se fichó hoy ese evento
        if: steps.decidir.outputs.evento != 'none' && github.event_name == 'schedule'
        id: cache
        uses: actions/cache@v4
        with:
          path: marcador.txt
          key: marcado-${{ steps.decidir.outputs.fecha }}-${{ steps.decidir.outputs.evento }}

      - name: Instalar dependencias
        if: steps.decidir.outputs.evento != 'none' && (github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true')
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fichar
        if: steps.decidir.outputs.evento != 'none' && (github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true')
        env:
          NETTIME_URL: ${{ secrets.NETTIME_URL }}
          NETTIME_USER: ${{ secrets.NETTIME_USER }}
          NETTIME_PASS: ${{ secrets.NETTIME_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          VACACIONES_SHEET_CSV_URL: ${{ secrets.VACACIONES_SHEET_CSV_URL }}
        run: |
          python fichar.py ${{ steps.decidir.outputs.evento }}
          echo "hecho" > marcador.txt

      - name: Subir capturas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-debug
          path: debug_*.png
          if-no-files-found: ignore
